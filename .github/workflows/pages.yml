name: Publicar Aethelgard 3D no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript e mapa
        run: |
          node --check src/app.js
          node --check src/seed.js
          node --check src/assets.js
          node --check src/asset-editor.js
          node --test tests/assets.test.mjs
          node --input-type=module -e "import('./src/seed.js').then(async m => { const w = await m.loadSeed(); if(w.biome.length!==14112||w.height.length!==14112||w.objects.length<1) process.exit(1); console.log('Mapa carregado', w.cols, w.rows) })"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
